<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>

  <!-- 외곽 쉴드 -->
  <path d="M256 56 L436 138 L436 286 Q436 392 256 458 Q76 392 76 286 L76 138 Z"
    stroke="#00B4D8" stroke-width="14" fill="rgba(0,180,216,0.05)"
    filter="url(#glow)"/>

  <!-- 내부 자물쇠 몸통 -->
  <rect x="192" y="262" width="128" height="96" rx="12"
    stroke="#00B4D8" stroke-width="10" fill="rgba(0,180,216,0.12)"/>

  <!-- 자물쇠 걸쇠 -->
  <path d="M215 262 L215 228 Q215 188 256 188 Q297 188 297 228 L297 262"
    stroke="#00B4D8" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- 자물쇠 키홀 -->
  <circle cx="256" cy="310" r="14" fill="#00B4D8"/>
  <rect x="249" y="318" width="14" height="22" rx="3" fill="#00B4D8"/>

  <!-- 글로우 필터 -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
